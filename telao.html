<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão — Avaliação Digital 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0e2f2a; --bg-mid:#1f5b4d; --bg-mid-2:#2c7a5f;
    --paper:#faf5e7; --gold:#e3a53d; --gold-deep:#c6862a; --coral:#e2604a; --green-ok:#3fae70;
    --silver:#c9d3da; --bronze:#cd8a4d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:'Inter', sans-serif; color:var(--paper);
    background:radial-gradient(70% 60% at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 55%, var(--bg-mid-2) 100%);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 100px;
    overflow-x:hidden;
  }

  .kicker{
    font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:0.2em;
    text-transform:uppercase; color:var(--gold); margin-bottom:4px;
  }
  h1{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(24px, 3.4vw, 40px);
    margin:0 0 28px; text-align:center;
  }

  .stage{ width:min(920px, 94vw); }

  /* ===================== MODO AUTOMÁTICO ===================== */
  .auto-section{ margin-bottom:28px; }
  .auto-section__title{
    font-family:'Baloo 2', sans-serif; font-size:16px; font-weight:700;
    color:rgba(250,245,231,0.7); text-transform:uppercase; letter-spacing:0.06em;
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }

  .auto-card{
    background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.08);
    border-radius:14px; padding:16px 20px; margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    animation:fadeIn .5s ease;
  }
  .auto-card.is-ativa{
    background:linear-gradient(90deg, rgba(227,165,61,0.22), rgba(0,0,0,0.18));
    border-color:rgba(227,165,61,0.5);
    animation:pulseAtiva 2.2s ease-in-out infinite;
  }
  .auto-card.is-desq{ background:rgba(226,96,74,0.16); border-color:rgba(226,96,74,0.4); }

  .auto-card__nome{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:18px; }
  .auto-card__sub{ font-size:12.5px; color:rgba(250,245,231,0.55); margin-top:2px; }
  .auto-card__destaque{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .destaque-chip{
    background:rgba(63,174,112,0.22); border:1px solid rgba(63,174,112,0.5);
    color:#a8f0c6; font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px;
  }
  .destaque-chip.is-destaque{ background:rgba(227,165,61,0.22); border-color:rgba(227,165,61,0.55); color:#ffe4a8; }
  .desq-chip{ background:rgba(226,96,74,0.25); border:1px solid rgba(226,96,74,0.6); color:#ffd9d0; font-size:12px; font-weight:700; padding:5px 12px; border-radius:999px; }

  .pendente-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .pendente-chip{
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    color:rgba(250,245,231,0.75); font-size:13px; padding:8px 14px; border-radius:10px;
  }

  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes pulseAtiva{ 0%,100%{ box-shadow:0 0 0 0 rgba(227,165,61,0.25);} 50%{ box-shadow:0 0 0 10px rgba(227,165,61,0);} }

  .empty{ text-align:center; color:rgba(250,245,231,0.5); padding:20px; font-size:14px; }

  .auto-note{
    text-align:center; font-size:13px; color:rgba(250,245,231,0.55); font-style:italic;
    margin:-14px 0 24px; max-width:640px; margin-left:auto; margin-right:auto;
  }
  .auto-card__destaque-wrap{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .auto-card__destaque-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(250,245,231,0.45); }

  /* ===================== TELA DE ESPERA (nome do evento em dourado) ===================== */
  .idle-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; text-align:center; }
  .idle-title{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:clamp(30px, 5.4vw, 66px);
    background:linear-gradient(110deg, #c6862a 0%, #fff1cf 22%, #e3a53d 45%, #fff1cf 68%, #c6862a 100%);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmerGold 5s linear infinite;
    margin:0; line-height:1.15;
  }
  .idle-sub{ color:rgba(250,245,231,0.55); font-size:15px; margin-top:16px; letter-spacing:0.03em; }
  @keyframes shimmerGold{ 0%{ background-position:0% 50%; } 100%{ background-position:300% 50%; } }
  #viewRevelacao{ position:relative; min-height:50vh; }
  #idleOverlay{ position:absolute; inset:0; transition:opacity .5s ease; }
  #idleOverlay.is-hidden{ opacity:0; pointer-events:none; }

  /* ===================== MODO REVELAÇÃO ===================== */
  .reveal-row{
    background:rgba(0,0,0,0.18); border:1px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:16px 22px; margin-bottom:12px;
    opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, background .3s ease, border-color .3s ease;
    max-height:1000px;
  }
  .reveal-row.is-revealed{ opacity:1; transform:translateY(0); }
  .reveal-row.sem-transicao, .reveal-row.sem-transicao *{ transition:none !important; animation:none !important; }

  .reveal-row__head{ display:flex; align-items:center; gap:16px; }
  .reveal-row__pos{ font-family:'Baloo 2', sans-serif; font-weight:800; font-size:26px; width:56px; text-align:center; color:var(--gold); flex-shrink:0; }
  .reveal-row__nome{ flex:1; min-width:0; }
  .reveal-row__nome strong{ display:block; font-size:19px; }
  .reveal-row__nome span{ font-size:12.5px; color:rgba(250,245,231,0.6); }
  .reveal-row__total{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:22px; flex-shrink:0; }

  .reveal-row.top1{ background:linear-gradient(90deg, rgba(227,165,61,0.32), rgba(0,0,0,0.18)); border-color:var(--gold); }
  .reveal-row.top1 .reveal-row__pos, .reveal-row.top1 .reveal-row__total{ color:var(--gold); }
  .reveal-row.top2{ background:linear-gradient(90deg, rgba(201,211,218,0.24), rgba(0,0,0,0.18)); border-color:var(--silver); }
  .reveal-row.top2 .reveal-row__pos, .reveal-row.top2 .reveal-row__total{ color:var(--silver); }
  .reveal-row.top3{ background:linear-gradient(90deg, rgba(205,138,77,0.26), rgba(0,0,0,0.18)); border-color:var(--bronze); }
  .reveal-row.top3 .reveal-row__pos, .reveal-row.top3 .reveal-row__total{ color:var(--bronze); }
  .reveal-row.top5:not(.top1):not(.top2):not(.top3) .reveal-row__nome strong{ text-shadow:0 0 14px rgba(227,165,61,0.4); }

  .reveal-row.is-desq{ background:rgba(226,96,74,0.18); border-color:rgba(226,96,74,0.5); }
  .reveal-row.is-desq .reveal-row__pos{ color:var(--coral); }

  .reveal-detalhe{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .45s ease, opacity .35s ease, margin-top .45s ease;
    margin-top:0;
  }
  .reveal-row.is-aberta .reveal-detalhe{ max-height:400px; opacity:1; margin-top:16px; }

  .reveal-detalhe__grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px; }
  .reveal-detalhe__item{ background:rgba(255,255,255,0.06); border-radius:10px; padding:10px 14px; }
  .reveal-detalhe__item .q-nome{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:rgba(250,245,231,0.6); }
  .reveal-detalhe__item .q-nota{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; margin-top:2px; }

  .reveal-empate-badge{
    display:inline-block; background:rgba(227,165,61,0.25); border:1px solid rgba(227,165,61,0.5);
    color:var(--gold); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:4px 10px; border-radius:999px; margin-bottom:10px;
  }
  .reveal-desempate-nota{ font-size:12px; color:rgba(250,245,231,0.65); margin-top:10px; }

  .reveal-premio-titulo{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:20px; color:var(--gold);
    text-align:center; margin-bottom:14px;
  }

  /* ===================== CONTROLES (equipe) ===================== */
  .controls{
    position:fixed; bottom:16px; right:16px;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:90vw;
    opacity:0.55; transition:opacity .2s ease;
  }
  .controls:hover{ opacity:1; }
  .controls button{
    font-family:'Inter', sans-serif; font-size:12px; font-weight:600;
    border:1px solid rgba(255,255,255,0.25); background:rgba(0,0,0,0.35); color:var(--paper);
    padding:8px 12px; border-radius:8px; cursor:pointer;
  }
  .controls button:hover{ background:rgba(0,0,0,0.55); }
  .controls button.is-active{ background:var(--gold); color:#20120a; border-color:var(--gold); }
</style>
</head>
<body>

  <p class="kicker">Conexão Junina · Avaliação Digital 2.0</p>
  <h1 id="eventoTitulo">Acompanhamento do Concurso</h1>

  <div class="stage">
    <div id="viewAutomatico" style="display:none;"></div>
    <div id="viewRevelacao">
      <div id="idleOverlay" class="idle-screen">
        <h1 class="idle-title" id="idleTitulo">Concurso</h1>
        <p class="idle-sub">Aguardando o início da revelação do ranking...</p>
      </div>
      <div id="revelacaoLista"></div>
    </div>
  </div>

  <div class="controls">
    <button id="btnModoAutomatico">🔴 Ativar modo automático</button>
    <button id="btnAvancar">Avançar revelação ▸</button>
    <button id="btnReiniciar">Reiniciar</button>
  </div>

<script src="assets/js/config.js?v=27"></script>
<script src="assets/js/mock-data.js?v=27"></script>
<script src="assets/js/api.js?v=27"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var EVT = params.get('evento') || window.APP_CONFIG.EVENT_ID;

  var modoAutomatico = false;
  var ultimoDados = null;

  function load() {
    Api.call('get_telao_notes', { event_id: EVT }).then(function (res) {
      ultimoDados = res;
      document.getElementById('eventoTitulo').textContent = res.nomeEvento || 'Acompanhamento do Concurso';
      if (modoAutomatico) renderAutomatico(res);
      else renderRevelacao(res);
    });
  }

  /* ===================== MODO AUTOMÁTICO ===================== */

  function renderAutomatico(res) {
    var host = document.getElementById('viewAutomatico');
    var partes = [];

    partes.push('<p class="auto-note">"Destaques do grupo" mostra em qual(is) quesito(s) o grupo teve sua MELHOR nota entre os quesitos dele mesmo — não significa que ele está vencendo aquele quesito no concurso geral.</p>');

    if (res.desqualificados && res.desqualificados.length) {
      partes.push('<div class="auto-section"><div class="auto-section__title">⚠ Desistentes / Desclassificados</div>' +
        res.desqualificados.map(function (d) {
          return '<div class="auto-card is-desq"><div><div class="auto-card__nome">' + d.nome + '</div>' +
            '<div class="auto-card__sub">' + (d.cidade || '') + '/' + d.estado + '</div></div>' +
            '<span class="desq-chip">' + (d.flag === 'DESISTENTE' ? 'Desistente' : 'Desclassificado') + '</span></div>';
        }).join('') + '</div>');
    }

    partes.push('<div class="auto-section"><div class="auto-section__title">🎤 Se apresentando agora</div>' +
      (res.ativa ? montarCardAtivo(res.ativa) : '<p class="empty">Nenhum grupo se apresentando no momento.</p>') + '</div>');

    partes.push('<div class="auto-section"><div class="auto-section__title">✔ Já se apresentaram</div>' +
      (res.jaApresentadas && res.jaApresentadas.length ? res.jaApresentadas.map(montarCardApresentado).join('') : '<p class="empty">Ninguém se apresentou ainda.</p>') + '</div>');

    if (res.pendentes && res.pendentes.length) {
      partes.push('<div class="auto-section"><div class="auto-section__title">⏳ Ainda vão se apresentar</div>' +
        '<div class="pendente-list">' + res.pendentes.map(function (p) { return '<span class="pendente-chip">' + p.nome + '</span>'; }).join('') + '</div></div>');
    }

    host.innerHTML = partes.join('');
  }

  function montarChipsDestaque(lista) {
    return lista.map(function (q) {
      var ehDestaque = q.familia === 'destaque';
      return '<span class="destaque-chip' + (ehDestaque ? ' is-destaque' : '') + '">' + (ehDestaque ? '👑 ' : '★ ') + q.nome + '</span>';
    }).join('');
  }

  function montarCardAtivo(c) {
    var chips = c.destaqueQuesitos.length
      ? montarChipsDestaque(c.destaqueQuesitos)
      : '<span style="color:rgba(250,245,231,0.5);font-size:12.5px;">Aguardando notas...</span>';
    return '<div class="auto-card is-ativa"><div><div class="auto-card__nome">' + c.nome + '</div>' +
      '<div class="auto-card__sub">' + (c.cidade || '') + '/' + c.estado + '</div></div>' +
      '<div class="auto-card__destaque-wrap"><div class="auto-card__destaque-label">Destaques do grupo</div><div class="auto-card__destaque">' + chips + '</div></div></div>';
  }

  function montarCardApresentado(c) {
    var chips = c.destaqueQuesitos.length
      ? montarChipsDestaque(c.destaqueQuesitos)
      : '<span style="color:rgba(250,245,231,0.4);font-size:12px;">Sem notas ainda</span>';
    return '<div class="auto-card"><div><div class="auto-card__nome">' + c.nome + '</div>' +
      '<div class="auto-card__sub">' + (c.cidade || '') + '/' + c.estado + '</div></div>' +
      '<div class="auto-card__destaque-wrap"><div class="auto-card__destaque-label">Destaques do grupo</div><div class="auto-card__destaque">' + chips + '</div></div></div>';
  }

  /* ===================== MODO REVELAÇÃO ===================== */

  // Monta a lista já na ORDEM DE EXIBIÇÃO (melhor colocado no topo), mas
  // cada item carrega sua "ordem de revelação" (do pior pro melhor,
  // efeito clássico de contagem regressiva) — são coisas independentes.
  function montarSequenciaExibicao(res) {
    var totalDesq = (res.desqualificados || []).length;
    var totalDestaques = (res.rankingsDestaques || []).length;

    var itensDesq = (res.desqualificados || []).map(function (d, idx) {
      return { tipo: 'desqualificado', dados: d, revealOrder: idx };
    });

    var itensDestaque = (res.rankingsDestaques || []).map(function (rd, idx) {
      var vencedores = (rd.ranking && rd.ranking.length) ? rd.ranking[0] : [];
      return { tipo: 'destaque-premio', grupo: rd.grupo, quesitos: rd.quesitos, vencedores: vencedores, revealOrder: totalDesq + idx };
    });

    var posicaoAtual = 1;
    var gruposComPosicao = (res.gruposRevelacao || []).map(function (grupo) {
      var pos = posicaoAtual;
      posicaoAtual += grupo.length;
      return { tipo: 'ranking', posicao: pos, membros: grupo };
    });
    var n = gruposComPosicao.length;
    gruposComPosicao.forEach(function (g, idx) { g.revealOrder = totalDesq + totalDestaques + (n - 1 - idx); });

    // ordem de exibição: desqualificados → prêmios de destaque → ranking geral (melhor no topo)
    return itensDesq.concat(itensDestaque).concat(gruposComPosicao);
  }

  var ultimaChaveRevelacao = null;
  var ultimoRevealIndexAplicado = null;

  function renderRevelacao(res) {
    document.getElementById('idleTitulo').textContent = res.nomeEvento || 'Concurso';
    document.getElementById('idleOverlay').classList.toggle('is-hidden', (res.revealIndex || 0) > 0);

    var host = document.getElementById('revelacaoLista');
    var revealIndex = res.revealIndex || 0;
    var sequencia = montarSequenciaExibicao(res);

    if (!sequencia.length) {
      host.innerHTML = '';
      return;
    }

    var chave = sequencia.map(function (item) {
      if (item.tipo === 'desqualificado') return 'D:' + item.dados.id;
      if (item.tipo === 'destaque-premio') return 'P:' + item.grupo + ':' + item.vencedores.map(function (m) { return m.id; }).join(',');
      return 'G:' + item.membros.map(function (m) { return m.id; }).join(',');
    }).join('|');

    if (chave !== ultimaChaveRevelacao) {
      construirDomRevelacao(res, sequencia);
      ultimaChaveRevelacao = chave;
      // Se é a primeiríssima vez que esta página monta a lista, aplica sem
      // animação (evita um "efeito cascata" estranho ao carregar a página
      // já no meio de uma cerimônia). Depois disso, tudo anima normalmente.
      aplicarEstadoRevelacao(revealIndex, ultimoRevealIndexAplicado === null);
      ultimoRevealIndexAplicado = revealIndex;
      return;
    }

    atualizarValoresRevelacao(sequencia);
    if (revealIndex !== ultimoRevealIndexAplicado) {
      aplicarEstadoRevelacao(revealIndex, false);
      ultimoRevealIndexAplicado = revealIndex;
    }
  }

  function construirDomRevelacao(res, sequencia) {
    var host = document.getElementById('revelacaoLista');

    host.innerHTML = sequencia.map(function (item) {
      if (item.tipo === 'desqualificado') {
        var d = item.dados;
        var infoReal = (d.cidade || '') + '/' + d.estado + ' · ' + (d.flag === 'DESISTENTE' ? 'Desistente' : 'Desclassificado');
        return '<div class="reveal-row is-desq" data-reveal-order="' + item.revealOrder + '">' +
          '<div class="reveal-row__head">' +
          '<div class="reveal-row__pos">⚠</div>' +
          '<div class="reveal-row__nome"><strong class="js-nome" data-real="' + escAttr(d.nome) + '">?????</strong>' +
          '<span class="js-info" data-real="' + escAttr(infoReal) + '"></span></div>' +
          '</div></div>';
      }

      if (item.tipo === 'destaque-premio') {
        var vencedores = item.vencedores || [];
        if (!vencedores.length) {
          return '<div class="reveal-row" data-reveal-order="' + item.revealOrder + '">' +
            '<div class="reveal-premio-titulo">🏆 Melhor ' + item.grupo + '</div>' +
            '<p class="empty" style="padding:0;">Ainda sem notas suficientes nesta categoria.</p></div>';
        }
        var empatadosP = vencedores.length > 1;
        var blocosVencedores = vencedores.map(function (v) {
          var quesitosHtml = item.quesitos.map(function (q) {
            return '<div class="reveal-detalhe__item"><div class="q-nome">' + q.nome + '</div><div class="q-nota" data-q="' + q.id + '">' + (v.detalhamento[q.id] || 0) + '</div></div>';
          }).join('');
          var infoReal = (v.cidade || '') + '/' + v.estado;
          return '<div class="reveal-membro" data-membro="premio-' + v.id + '" style="' + (empatadosP ? 'margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,0.15);' : '') + '">' +
            '<div class="reveal-row__head">' +
            '<div class="reveal-row__pos">🏆</div>' +
            '<div class="reveal-row__nome"><strong class="js-nome" data-real="' + escAttr(v.nome) + '">?????</strong><span class="js-info" data-real="' + escAttr(infoReal) + '"></span></div>' +
            '<div class="reveal-row__total js-total" data-total="premio-' + v.id + '" data-real="' + v.total + '">—</div>' +
            '</div>' +
            '<div class="reveal-detalhe"><div class="reveal-detalhe__grid">' + quesitosHtml + '</div></div>' +
            '</div>';
        }).join('');

        return '<div class="reveal-row top1" data-reveal-order="' + item.revealOrder + '">' +
          '<div class="reveal-premio-titulo">🏆 Melhor ' + item.grupo + '</div>' +
          (empatadosP ? '<div class="reveal-empate-badge">🤝 Empate</div>' : '') +
          blocosVencedores +
          '</div>';
      }

      var classePosicao = item.posicao === 1 ? 'top1' : item.posicao === 2 ? 'top2' : item.posicao === 3 ? 'top3' : (item.posicao <= 5 ? 'top5' : '');
      var membros = item.membros;
      var empatados = membros.length > 1;

      var blocosMembros = membros.map(function (m) {
        var quesitosHtml = res.quesitos.map(function (q) {
          return '<div class="reveal-detalhe__item"><div class="q-nome">' + (q.nomeExibicao || q.nome) + '</div><div class="q-nota" data-q="' + q.id + '">' + (m.detalhamento[q.id] || 0) + '</div></div>';
        }).join('');
        var infoReal = (m.cidade || '') + '/' + m.estado;

        return '<div class="reveal-membro" data-membro="' + m.id + '" style="' + (empatados ? 'margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed rgba(255,255,255,0.15);' : '') + '">' +
          '<div class="reveal-row__head">' +
          '<div class="reveal-row__pos">' + item.posicao + 'º</div>' +
          '<div class="reveal-row__nome"><strong class="js-nome" data-real="' + escAttr(m.nome) + '">?????</strong><span class="js-info" data-real="' + escAttr(infoReal) + '"></span></div>' +
          '<div class="reveal-row__total js-total" data-total="' + m.id + '" data-real="' + m.total + '">—</div>' +
          '</div>' +
          '<div class="reveal-detalhe"><div class="reveal-detalhe__grid">' + quesitosHtml + '</div>' +
          (m.observacao && m.observacao.indexOf('Desempate aplicado') === 0 ? '<p class="reveal-desempate-nota">⚖ ' + m.observacao + '</p>' : '') +
          '</div>' +
          '</div>';
      }).join('');

      return '<div class="reveal-row ' + classePosicao + '" data-reveal-order="' + item.revealOrder + '">' +
        (empatados ? '<div class="reveal-empate-badge">🤝 Empate — ' + membros.length + ' grupos na ' + item.posicao + 'ª posição</div>' : '') +
        blocosMembros +
        '</div>';
    }).join('');
  }

  function escAttr(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  // Só liga/desliga as classes de revelação em cima do DOM que já existe
  // — como os elementos já estavam lá com o estado "antes", a transição
  // do CSS de fato acontece (é isso que fazia a animação não aparecer).
  // Também troca "?????" pelo nome/pontuação de verdade só na hora de
  // revelar, pra ninguém adiantar o resultado espiando o código da página.
  function aplicarEstadoRevelacao(revealIndex, semAnimacao) {
    var linhas = document.querySelectorAll('#viewRevelacao .reveal-row[data-reveal-order]');
    linhas.forEach(function (linha) {
      var ordem = Number(linha.dataset.revealOrder);
      var vaiRevelar = ordem < revealIndex;
      if (semAnimacao) linha.classList.add('sem-transicao');

      if (vaiRevelar) {
        linha.querySelectorAll('.js-nome, .js-info, .js-total').forEach(function (el) {
          if (el.dataset.real !== undefined) el.textContent = el.dataset.real;
        });
      }

      linha.classList.toggle('is-revealed', vaiRevelar);
      linha.classList.toggle('is-aberta', ordem === revealIndex - 1);
      if (semAnimacao) {
        linha.offsetHeight; // força reflow antes de tirar a trava de transição
        linha.classList.remove('sem-transicao');
      }
    });
  }

  // Os números podem mudar mesmo depois de revelado, se uma correção for
  // validada durante a cerimônia — atualiza sem redesenhar tudo de novo.
  function atualizarValoresRevelacao(sequencia) {
    sequencia.forEach(function (item) {
      if (item.tipo !== 'ranking') return;
      item.membros.forEach(function (m) {
        var totalEl = document.querySelector('[data-total="' + m.id + '"]');
        if (totalEl) {
          totalEl.dataset.real = m.total;
          var linhaPai = totalEl.closest('.reveal-row');
          if (linhaPai && linhaPai.classList.contains('is-revealed')) totalEl.textContent = m.total;
        }
        Object.keys(m.detalhamento).forEach(function (qid) {
          var qEl = document.querySelector('.reveal-membro[data-membro="' + m.id + '"] [data-q="' + qid + '"]');
          if (qEl) qEl.textContent = m.detalhamento[qid];
        });
      });
    });
  }

  /* ===================== CONTROLES ===================== */

  document.getElementById('btnModoAutomatico').addEventListener('click', function () {
    modoAutomatico = !modoAutomatico;
    document.getElementById('btnModoAutomatico').classList.toggle('is-active', modoAutomatico);
    document.getElementById('btnModoAutomatico').textContent = modoAutomatico ? '🔴 Modo automático ativo' : '⚪ Ativar modo automático';
    document.getElementById('viewAutomatico').style.display = modoAutomatico ? 'block' : 'none';
    document.getElementById('viewRevelacao').style.display = modoAutomatico ? 'none' : 'block';
    document.getElementById('btnAvancar').style.display = modoAutomatico ? 'none' : 'inline-block';
    document.getElementById('btnReiniciar').style.display = modoAutomatico ? 'none' : 'inline-block';
    if (ultimoDados) { if (modoAutomatico) renderAutomatico(ultimoDados); else renderRevelacao(ultimoDados); }
  });

  document.getElementById('btnAvancar').addEventListener('click', function () {
    Api.call('get_telao_reveal_state', { event_id: EVT }).then(function (res) {
      var total = ultimoDados ? ultimoDados.totalPassosRevelacao : 999;
      var next = Math.min((res.revealIndex || 0) + 1, total);
      Api.call('set_telao_reveal_index', { event_id: EVT, index: next }).then(function () { load(); });
    });
  });

  document.getElementById('btnReiniciar').addEventListener('click', function () {
    Api.call('set_telao_reveal_index', { event_id: EVT, index: 0 }).then(function () { load(); });
  });

  // Começa no modo revelação manual (o padrão de sempre) — o botão liga
  // o modo automático quando o presidente/operador quiser.
  load();
  setInterval(load, 4000);
</script>
</body>
</html>
